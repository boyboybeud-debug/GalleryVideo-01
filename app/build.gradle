plugins {
    id 'com.android.application'
}

android {
    namespace 'de.zinformatik.galleryvideo'
    compileSdk 34

    defaultConfig {
        applicationId "de.zinformatik.galleryvideo"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.0'
}
